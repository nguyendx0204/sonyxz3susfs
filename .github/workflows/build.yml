name: Build KernelSU Next SUSFS Xperia XZ3

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "LineageOS Kernel Branch"
        required: true
        default: "lineage-22.2"
        type: string
      susfs_variant:
        description: "SUSFS 4.9 Variant (v1 = simonpunk 1.5.5, v2 = wxx9248 2.3.0)"
        required: true
        default: "v1"
        type: choice
        options:
          - v1
          - v2
      ksu_branch:
        description: "KernelSU Next Branch"
        required: true
        default: "legacy"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel (akatsuki)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang curl flex git git-lfs gnupg gperf \
            imagemagick kmod libdw-dev libelf-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lld llvm lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc xxd zip zlib1g-dev \
            python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-akatsuki-${{ inputs.kernel_branch }}-${{ inputs.susfs_variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-akatsuki-${{ inputs.kernel_branch }}-${{ inputs.susfs_variant }}-
            ccache-akatsuki-

      - name: Setup Prebuilt Clang Toolchain (LineageOS / Proton Clang)
        run: |
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            "${GITHUB_WORKSPACE}/clang" || \
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            "${GITHUB_WORKSPACE}/clang"
          echo "${GITHUB_WORKSPACE}/clang/bin" >> "$GITHUB_PATH"

      - name: Clone LineageOS Kernel Source
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            https://github.com/LineageOS/android_kernel_sony_sdm845.git \
            "${GITHUB_WORKSPACE}/kernel"

      - name: Clone SUSFS 4.9 Patches
        run: |
          if [ "${{ inputs.susfs_variant }}" = "v2" ]; then
            echo "[*] Cloning wxx9248 SUSFS v2.3.0 port for Linux 4.9..."
            git clone --depth=1 -b kernel-4.9-v2 \
              https://github.com/wxx9248/susfs4ksu.git \
              "${GITHUB_WORKSPACE}/susfs4ksu"
          else
            echo "[*] Cloning simonpunk SUSFS v1.5.5 for Linux 4.9..."
            git clone --depth=1 -b kernel-4.9 \
              https://gitlab.com/simonpunk/susfs4ksu.git \
              "${GITHUB_WORKSPACE}/susfs4ksu" || \
            git clone --depth=1 -b kernel-4.9 \
              https://github.com/Star-Seven/susfs4ksu.git \
              "${GITHUB_WORKSPACE}/susfs4ksu"
          fi

      - name: Integrate KernelSU Next and Disable Kprobes
        working-directory: ${{ github.workspace }}/kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "${{ inputs.ksu_branch }}"
          echo "[*] Disabling KPROBES inside KernelSU directory for Linux 4.9..."
          find KernelSU-Next/kernel/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +

      - name: Apply SUSFS Patches and Manual Syscall Hooks
        working-directory: ${{ github.workspace }}/kernel
        run: |
          SUSFS_DIR="${GITHUB_WORKSPACE}/susfs4ksu"
          cp -v "${SUSFS_DIR}/kernel_patches/fs/"* fs/
          cp -v "${SUSFS_DIR}/kernel_patches/include/linux/"* include/linux/

          if [ -f "${SUSFS_DIR}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
            pushd KernelSU-Next >/dev/null
            patch -p1 --forward < "${SUSFS_DIR}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
            popd >/dev/null
          fi

          echo "[*] Applying 50_add_susfs_in_kernel-4.9.patch..."
          patch -p1 --forward < "${SUSFS_DIR}/kernel_patches/50_add_susfs_in_kernel-4.9.patch" || true

          python3 - << 'PYEOF'
          from pathlib import Path

          # 1. fs/exec.c
          p = Path("fs/exec.c")
          txt = p.read_text()
          if "ksu_handle_execveat" not in txt:
              decl = (
                  "#ifdef CONFIG_KSU\n"
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
                  "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
                  "#endif\n\n"
                  "int do_execve("
              )
              txt = txt.replace("int do_execve(", decl, 1)
              txt = txt.replace(
                  "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);",
                  "#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);",
                  2,
              )
              p.write_text(txt)
              print("[+] Hooked fs/exec.c")

          # 2. fs/open.c
          p = Path("fs/open.c")
          txt = p.read_text()
          if "ksu_handle_faccessat" not in txt:
              decl = (
                  "#ifdef CONFIG_KSU\n"
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *mode, int *flags);\n"
                  "#endif\n\n"
                  "SYSCALL_DEFINE3(faccessat,"
              )
              txt = txt.replace("SYSCALL_DEFINE3(faccessat,", decl, 1)
              target = "\tif (mode & ~S_IRWXO)"
              hook = "#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n" + target
              txt = txt.replace(target, hook, 1)
              p.write_text(txt)
              print("[+] Hooked fs/open.c")

          # 3. fs/read_write.c
          p = Path("fs/read_write.c")
          txt = p.read_text()
          if "ksu_handle_sys_read" not in txt:
              decl = (
                  "#ifdef CONFIG_KSU\n"
                  "extern bool ksu_vfs_read_hook __read_mostly;\n"
                  "extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,\n"
                  "\t\t\t\tchar __user **buf_ptr, size_t *count_ptr);\n"
                  "#endif\n\n"
                  "SYSCALL_DEFINE3(read,"
              )
              txt = txt.replace("SYSCALL_DEFINE3(read,", decl, 1)
              target = "\tif (f.file) {"
              hook = (
                  "#ifdef CONFIG_KSU\n"
                  "\tif (unlikely(ksu_vfs_read_hook))\n"
                  "\t\tksu_handle_sys_read(fd, &buf, &count);\n"
                  "#endif\n" + target
              )
              txt = txt.replace(target, hook, 1)
              p.write_text(txt)
              print("[+] Hooked fs/read_write.c")

          # 4. fs/stat.c
          p = Path("fs/stat.c")
          txt = p.read_text()
          if "ksu_handle_stat" not in txt:
              decl = (
                  "#ifdef CONFIG_KSU\n"
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *flags);\n"
                  "#endif\n\n"
                  "SYSCALL_DEFINE4(newfstatat,"
              )
              txt = txt.replace("SYSCALL_DEFINE4(newfstatat,", decl, 1)
              target = "\terror = vfs_fstatat(dfd, filename, &stat, flag);"
              hook = "#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n" + target
              txt = txt.replace(target, hook, 1)
              p.write_text(txt)
              print("[+] Hooked fs/stat.c")

          # 5. kernel/reboot.c
          p = Path("kernel/reboot.c")
          txt = p.read_text()
          if "ksu_handle_sys_reboot" not in txt:
              decl = (
                  "#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                  "#endif\n\n"
                  "SYSCALL_DEFINE4(reboot,"
              )
              txt = txt.replace("SYSCALL_DEFINE4(reboot,", decl, 1)
              target = "\tif (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))"
              hook = "#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n" + target
              txt = txt.replace(target, hook, 1)
              p.write_text(txt)
              print("[+] Hooked kernel/reboot.c")
          PYEOF

          echo "[*] Checking for any rejected patch hunks (.rej)..."
          REJ_FILES=$(find . -name "*.rej" || true)
          if [ -n "$REJ_FILES" ]; then
            echo "::warning::Found rejected patch hunks:"
            echo "$REJ_FILES"
            mkdir -p "${GITHUB_WORKSPACE}/rej_logs"
            for f in $REJ_FILES; do
              cp --parents "$f" "${GITHUB_WORKSPACE}/rej_logs/"
            done
          fi

      - name: Configure tama_akatsuki_defconfig
        working-directory: ${{ github.workspace }}/kernel
        run: |
          DEFCONFIG_FILE="arch/arm64/configs/tama_akatsuki_defconfig"
          {
            echo ""
            echo "# KernelSU Next & SUSFS Configuration"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_KPROBE_HOOKS=n"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_SU=n"
            echo "CONFIG_TMPFS_XATTR=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
          } >> "${DEFCONFIG_FILE}"

          sed -i "s/printf '%s' -dirty/printf '%s' ''/g" scripts/setlocalversion

      - name: Compile Kernel (Image.gz-dtb)
        working-directory: ${{ github.workspace }}/kernel
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR="${HOME}/.ccache"
          ccache -M 5G

          make O=out ARCH=arm64 tama_akatsuki_defconfig

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CLANG_TARGET_ARM32="--target=arm-linux-gnueabi" \
            CLANG_GCC32_TC="--gcc-toolchain=/usr" \
            CLANG_PREFIX32="--prefix=/usr/bin/" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package Flashable AnyKernel3 ZIP
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "${GITHUB_WORKSPACE}/AnyKernel3"
          cp -f "${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image.gz-dtb" "${GITHUB_WORKSPACE}/AnyKernel3/"

          {
            echo "### AnyKernel3 Ramdisk Mod Script"
            echo "## osm0sis @ xda-developers"
            echo "properties() { '"
            echo "kernel.string=KernelSU-Next + SUSFS for Xperia XZ3 (akatsuki) LineageOS 22.2"
            echo "do.devicecheck=1"
            echo "do.modules=0"
            echo "do.systemless=1"
            echo "do.cleanup=1"
            echo "do.cleanuponabort=0"
            echo "device.name1=akatsuki"
            echo "device.name2=H8416"
            echo "device.name3=H9436"
            echo "device.name4=H9493"
            echo "supported.versions=15"
            echo "'; }"
            echo ""
            echo "block=/dev/block/bootdevice/by-name/boot;"
            echo "is_slot_device=1;"
            echo "ramdisk_compression=auto;"
            echo "patch_vbmeta_flag=auto;"
            echo ""
            echo ". tools/ak3-core.sh;"
            echo "dump_boot;"
            echo "write_boot;"
          } > "${GITHUB_WORKSPACE}/AnyKernel3/anykernel.sh"

          cd "${GITHUB_WORKSPACE}/AnyKernel3"
          ZIP_NAME="KSUN-SUSFS-XperiaXZ3-akatsuki-LOS22.2-$(date +%Y%m%d).zip"
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" . -x ".git*" "README.md" "*placeholder"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload AnyKernel3 Flashable ZIP Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload Rejected Patch Logs (If Any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejected-hunks-debug
          path: ${{ github.workspace }}/rej_logs/
          if-no-files-found: ignore
