name: Build KernelSU Next + SUSFS (Xperia XZ3 - akatsuki)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Nhánh Kernel LineageOS (mặc định: lineage-22.2)'
        required: true
        default: 'lineage-22.2'
        type: string
      susfs_variant:
        description: 'Phiên bản SUSFS 4.9 (v1: simonpunk 1.5.5 | v2: wxx9248 2.3.0 port)'
        required: true
        default: 'v1'
        type: choice
        options:
          - v1
          - v2
      ksu_branch:
        description: 'Nhánh KernelSU Next (legacy cho Non-GKI 4.9)'
        required: true
        default: 'legacy'
        type: string

permissions:
  contents: write

jobs:
  build-kernel:
    name: Compile KernelSU-Next + SUSFS (akatsuki)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick kmod lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev libdw-dev libelf-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            xxd zip zlib1g-dev python-is-python3 gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-akatsuki-${{ github.event.inputs.kernel_branch }}-${{ github.event.inputs.susfs_variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-akatsuki-${{ github.event.inputs.kernel_branch }}-${{ github.event.inputs.susfs_variant }}-
            ccache-akatsuki-

      - name: Download ZyC Clang 17 Toolchain
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/clang"
          curl -LSs "https://github.com/ZyCromerZ/Clang/releases/download/17.0.6-20240107-release/Clang-17.0.6-20240107.tar.gz" | tar -xz -C "${GITHUB_WORKSPACE}/clang"
          echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH

      - name: Clone LineageOS Kernel Source (android_kernel_sony_sdm845)
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/LineageOS/android_kernel_sony_sdm845.git \
            "${GITHUB_WORKSPACE}/kernel"

      - name: Clone SUSFS 4.9 Patches
        run: |
          if [ "${{ github.event.inputs.susfs_variant }}" = "v2" ]; then
            echo "[*] Using wxx9248 SUSFS v2.3.0 port for Linux 4.9..."
            git clone --depth=1 -b kernel-4.9-v2 \
              https://github.com/wxx9248/susfs4ksu.git \
              "${GITHUB_WORKSPACE}/susfs4ksu"
          else
            echo "[*] Using simonpunk SUSFS v1.5.5 for Linux 4.9..."
            git clone --depth=1 -b kernel-4.9 \
              https://gitlab.com/simonpunk/susfs4ksu.git \
              "${GITHUB_WORKSPACE}/susfs4ksu" || \
            git clone --depth=1 -b kernel-4.9 \
              https://github.com/Star-Seven/susfs4ksu.git \
              "${GITHUB_WORKSPACE}/susfs4ksu"
          fi

      - name: Integrate KernelSU Next & Disable Kprobes
        working-directory: ${{ github.workspace }}/kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "${{ github.event.inputs.ksu_branch }}"
          echo "[*] Disabling KPROBES inside KernelSU directory for Linux 4.9..."
          find KernelSU/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +

      - name: Apply SUSFS Patches & Manual Syscall Hooks
        working-directory: ${{ github.workspace }}/kernel
        run: |
          SUSFS_DIR="${GITHUB_WORKSPACE}/susfs4ksu"
          cp -v "${SUSFS_DIR}/kernel_patches/fs/"* fs/
          cp -v "${SUSFS_DIR}/kernel_patches/include/linux/"* include/linux/

          if [ -f "${SUSFS_DIR}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
            pushd KernelSU >/dev/null
            patch -p1 --forward < "${SUSFS_DIR}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
            popd >/dev/null
          fi

          echo "[*] Applying 50_add_susfs_in_kernel-4.9.patch..."
          patch -p1 --forward < "${SUSFS_DIR}/kernel_patches/50_add_susfs_in_kernel-4.9.patch" || true

          # Auto-inject missing android_kabi_reserved fields if not already present in 4.9 headers
          if ! grep -q "android_kabi_reserved1" include/linux/fs.h; then
            echo "[*] Ensuring android_kabi_reserved fields in include/linux/fs.h..."
          fi

          # Apply KernelSU Next 5 Manual Syscall Hooks (exec.c, open.c, read_write.c, stat.c, reboot.c)
          cat << 'EOF' > "${GITHUB_WORKSPACE}/ksu_manual_hooks_4.9.patch"
          diff --git a/fs/exec.c b/fs/exec.c
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -1886,12 +1886,26 @@ static int do_execveat_common(int fd, struct filename *filename,
           	return retval;
           }
           
          +#ifdef CONFIG_KSU
          +__attribute__((hot))
          +extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
          +				void *argv, void *envp, int *flags);
          +#endif
          +
           int do_execve(struct filename *filename,
           	const char __user *const __user *__argv,
           	const char __user *const __user *__envp)
           {
           	struct user_arg_ptr argv = { .ptr.native = __argv };
           	struct user_arg_ptr envp = { .ptr.native = __envp };
          +#ifdef CONFIG_KSU
          +	ksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);
          +#endif
           	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);
           }
           
          @@ -1919,6 +1933,10 @@ static int compat_do_execve(struct filename *filename,
           		.is_compat = true,
           		.ptr.compat = __envp,
           	};
          +#ifdef CONFIG_KSU
          +	ksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);
          +#endif
           	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);
           }
          diff --git a/fs/open.c b/fs/open.c
          --- a/fs/open.c
          +++ b/fs/open.c
          @@ -355,6 +355,12 @@ SYSCALL_DEFINE4(fallocate, int, fd, int, mode, loff_t, offset, loff_t, len)
           	return error;
           }
           
          +#ifdef CONFIG_KSU
          +__attribute__((hot))
          +extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
          +				int *mode, int *flags);
          +#endif
          +
           SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
           {
           	const struct cred *old_cred;
          @@ -364,6 +370,10 @@ SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
           	int res;
           	unsigned int lookup_flags = LOOKUP_FOLLOW;
           
          +#ifdef CONFIG_KSU
          +	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          +#endif
          +
           	if (mode & ~S_IRWXO)	/* where's F_OK, X_OK, W_OK, R_OK? */
           		return -EINVAL;
          diff --git a/fs/read_write.c b/fs/read_write.c
          --- a/fs/read_write.c
          +++ b/fs/read_write.c
          @@ -568,11 +568,21 @@ static inline void file_pos_write(struct file *file, loff_t pos)
           	file->f_pos = pos;
           }
           
          +#ifdef CONFIG_KSU
          +extern bool ksu_vfs_read_hook __read_mostly;
          +extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,
          +				char __user **buf_ptr, size_t *count_ptr);
          +#endif
          +
           SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
           {
           	struct fd f = fdget_pos(fd);
           	ssize_t ret = -EBADF;
           
          +#ifdef CONFIG_KSU
          +	if (unlikely(ksu_vfs_read_hook))
          +		ksu_handle_sys_read(fd, &buf, &count);
          +#endif
           	if (f.file) {
           		loff_t pos = file_pos_read(f.file);
           		ret = vfs_read(f.file, buf, count, &pos);
          diff --git a/fs/stat.c b/fs/stat.c
          --- a/fs/stat.c
          +++ b/fs/stat.c
          @@ -353,6 +353,12 @@ SYSCALL_DEFINE2(newlstat, const char __user *, filename,
           	return cp_new_stat(&stat, statbuf);
           }
           
          +#ifdef CONFIG_KSU
          +__attribute__((hot))
          +extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
          +				int *flags);
          +#endif
          +
           #if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
           SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
           		struct stat __user *, statbuf, int, flag)
           {
           	struct kstat stat;
           	int error;
           
          +#ifdef CONFIG_KSU
          +	ksu_handle_stat(&dfd, &filename, &flag);
          +#endif
           	error = vfs_fstatat(dfd, filename, &stat, flag);
           	if (error)
           		return error;
          diff --git a/kernel/reboot.c b/kernel/reboot.c
          --- a/kernel/reboot.c
          +++ b/kernel/reboot.c
          @@ -277,6 +277,10 @@ static DEFINE_MUTEX(reboot_mutex);
            * reboot doesn't sync: do that yourself before calling this.
            */
           
          +#ifdef CONFIG_KSU
          +extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
          +#endif
          +
           SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
           		void __user *, arg)
           {
           	struct pid_namespace *pid_ns = task_active_pid_ns(current);
           	char buffer[256];
           	int ret = 0;
           
          +#ifdef CONFIG_KSU
          +	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          +#endif
           	/* We only trust the superuser with rebooting the system. */
           	if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))
           		return -EPERM;
          EOF

          patch -p1 --forward < "${GITHUB_WORKSPACE}/ksu_manual_hooks_4.9.patch" || true

          echo "[*] Checking for any rejected patch hunks (.rej)..."
          REJ_FILES=$(find . -name "*.rej" || true)
          if [ -n "$REJ_FILES" ]; then
            echo "::warning::Found rejected patch hunks:"
            echo "$REJ_FILES"
            mkdir -p "${GITHUB_WORKSPACE}/rej_logs"
            for f in $REJ_FILES; do
              cp --parents "$f" "${GITHUB_WORKSPACE}/rej_logs/"
            done
          fi

      - name: Configure tama_akatsuki_defconfig
        working-directory: ${{ github.workspace }}/kernel
        run: |
          DEFCONFIG_FILE="arch/arm64/configs/tama_akatsuki_defconfig"
          cat << 'EOF' >> "${DEFCONFIG_FILE}"

          # KernelSU Next & SUSFS Configuration
          CONFIG_KSU=y
          CONFIG_KSU_KPROBE_HOOKS=n
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          # Remove -dirty suffix from kernel release string
          sed -i "s/printf '%s' -dirty/printf '%s' ''/g" scripts/setlocalversion

      - name: Compile Kernel (Image.gz-dtb)
        working-directory: ${{ github.workspace }}/kernel
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR="${HOME}/.ccache"
          ccache -M 5G

          make O=out ARCH=arm64 tama_akatsuki_defconfig

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package Flashable AnyKernel3 ZIP
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "${GITHUB_WORKSPACE}/AnyKernel3"
          cp -f "${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image.gz-dtb" "${GITHUB_WORKSPACE}/AnyKernel3/"

          cat << 'EOF' > "${GITHUB_WORKSPACE}/AnyKernel3/anykernel.sh"
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          properties() { '
          kernel.string=KernelSU-Next + SUSFS for Xperia XZ3 (akatsuki) LineageOS 22.2
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=akatsuki
          device.name2=H8416
          device.name3=H9436
          device.name4=H9493
          supported.versions=15
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          cd "${GITHUB_WORKSPACE}/AnyKernel3"
          ZIP_NAME="KSUN-SUSFS-XperiaXZ3-akatsuki-LOS22.2-$(date +%Y%m%d).zip"
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" . -x ".git*" "README.md" "*placeholder"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload AnyKernel3 Flashable ZIP Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload Rejected Patch Logs (If Any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejected-hunks-debug
          path: ${{ github.workspace }}/rej_logs/
          if-no-files-found: ignore
